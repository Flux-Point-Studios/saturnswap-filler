# Woodpecker CI for Flux-Point-Studios/saturnswap-filler (TypeScript lib, npm).
# Fresh config (no prior GitHub Actions). Runs on PRs and main pushes and reports
# the ci/woodpecker/pr/woodpecker commit status so branch protection can gate merges.
# Library repo — no deploy, just typecheck + tests.
when:
  - event: [push, pull_request]
    branch: main

steps:
  - name: build-test
    image: node:20-bookworm
    commands:
      - npm ci
      # This repo is PUBLIC, so a commit here is a publication. Runs against the full tree in CI
      # (the pre-commit path checks only what is staged), because a value that reached the branch
      # is already disclosed and the point is to catch it before anyone else does.
      - git diff --name-only origin/main...HEAD > /tmp/changed || true
      - bash scripts/check-public-hygiene.sh --files-from /tmp/changed
      - npm run typecheck
      - npm test
